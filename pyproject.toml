[project]
name = "alert-bot-demo"
version = "0.1.0"
description = "A demo alerting service: admin API for cadmin, MCP server, abstract alert types, no live data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128",
    "uvicorn>=0.34.3",
    "motor>=3.7.1",
    "pydantic>=2.11.5,<3.0",
    "pydantic-settings>=2.9.1",
    "httpx>=0.28.1",
    "click>=8.3.1",
    # The MCP server (src/mcp_server) is part of the image, so both are runtime dependencies.
    "mcp>=1.2,<2",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.11.12",
    "mypy>=1.18.1",
    # In-memory Mongo for the unit tests: the same query language the routers send to a running one.
    "mongomock-motor>=0.0.30",
]

[tool.ruff]
line-length = 120
target-version = "py313"
lint.select = ["I", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
